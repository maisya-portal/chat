<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)"/>

  <!-- Glowing Chat Bubble Shape -->
  <path d="M 50 14 C 28.5 14 11 30.5 11 50.8 C 11 58.2 13.2 65.1 17 70.9 L 13 87 L 29.8 82.8 C 35.8 86 42.7 87.6 50 87.6 C 71.5 87.6 89 71.1 89 50.8 C 89 30.5 71.5 14 50 14 Z" 
        fill="url(#bubbleGrad)" 
        stroke="#34d399" 
        stroke-width="2.5" 
        filter="url(#neonGlow)"/>

  <!-- Highlight Overlay -->
  <path d="M 50 17 C 31 17 15.5 31.5 15.5 49 C 15.5 53 16.5 57 18.5 60.5 C 23 45 40 33 65 33 C 74 33 82 35.5 86.5 40 C 85 27 69 17 50 17 Z" 
        fill="#ffffff" 
        opacity="0.18"/>

  <!-- Crescent Moon -->
  <path d="M 52 30 C 42 30 34 38 34 48 C 34 58 42 66 52 66 C 45 66 39 60 39 51 C 39 42 45 35 52 30 Z" 
        fill="#ffffff" 
        filter="url(#neonGlow)"/>

  <!-- 8-Pointed Star -->
  <path d="M 64 40 L 66 45 L 71 45 L 67 48 L 68 53 L 64 50 L 60 53 L 61 48 L 57 45 L 62 45 Z" 
        fill="#a7f3d0" 
        filter="url(#neonGlow)"/>
</svg>